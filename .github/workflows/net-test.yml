name: Tests réseau

on:
  push:
    branches: ["v0.*"]
  workflow_dispatch:

jobs:
  net:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -U yt-dlp
      - run: yt-dlp --version
      - name: Tests réseau (YouTube, SoundCloud, Spotify)
        working-directory: src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo test --release net_ -- --ignored --nocapture --test-threads=1 2>&1 | tee net.txt
      - name: Résultats en annotations
        if: always()
        working-directory: src-tauri
        shell: bash
        run: |
          grep -E "\||YouTube:|search|open.spotify|succès|erreur|panicked|test result" net.txt | tr -d '\r' | head -40 > res.txt || true
          # 10 annotations max par étape : 5 lignes par annotation.
          paste -d'~' - - - - - < res.txt | sed 's/~/ ¦ /g; s/^/::notice title=net::/'
