name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé de signature des mises à jour automatiques (secret du dépôt).
          # Sans elle, la version se publie quand même, sans mise à jour auto.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.json' || '' }}
          # Une release publiée par version (tauri.conf.json) : v0.2.0, v0.3.0…
          tagName: v__VERSION__
          releaseName: "TrackFetcher v__VERSION__"
          releaseBody: "Télécharge le fichier `.exe` ci-dessous et lance-le pour installer TrackFetcher sur Windows."
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: TrackFetcher-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
